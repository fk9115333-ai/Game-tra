<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Tracker Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شريط التنقل العلوي -->
    <header class="glass-header">
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i>
            <span>تتبعي</span>
        </div>
        <div class="header-actions">
            <span class="games-count" id="upcomingCount">0 قادمة</span>
            <button class="icon-btn" onclick="openSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="icon-btn primary" onclick="openSearch()"><i class="fa-solid fa-plus"></i></button>
        </div>
    </header>

    <!-- نافذة البحث السريع -->
    <div id="searchModal" class="modal">
        <div class="modal-content glass-panel">
            <div class="search-header">
                <input type="text" id="searchInput" placeholder="ابحث عن لعبة (مثال: Resident Evil)..." autocomplete="off">
                <button class="icon-btn" onclick="closeSearch()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>
    </div>

    <!-- المحتوى الرئيسي (الصفحات) -->
    <main id="app-content">
        <!-- 1. صفحة الألعاب القادمة -->
        <section id="upcoming-page" class="page active">
            <div class="filters">
                <button class="filter-chip active">الكل</button>
                <button class="filter-chip">PS5</button>
                <button class="filter-chip">PC</button>
            </div>
            <div id="upcomingList" class="games-grid">
                <!-- سيتم حقن البطاقات هنا -->
            </div>
        </section>

        <!-- 2. صفحة الألعاب المختومة -->
        <section id="completed-page" class="page" style="display: none; padding: 60px 20px; text-align: center;">
            <i class="fa-solid fa-check-double" style="font-size: 4rem; color: var(--success); margin-bottom: 20px;"></i>
            <h2>الألعاب المختومة</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">بمجرد تختيمك للعبة، ستتمكن من نقلها إلى هنا مع إضافة تقييمك الخاص وعدد ساعات اللعب.</p>
        </section>

        <!-- 3. صفحة قائمة الانتظار -->
        <section id="waitlist-page" class="page" style="display: none; padding: 60px 20px; text-align: center;">
            <i class="fa-solid fa-clock" style="font-size: 4rem; color: var(--text-muted); margin-bottom: 20px;"></i>
            <h2>قائمة الانتظار</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">الألعاب التي تخطط للعبها لاحقاً ستظهر هنا لتنظيم جدولك.</p>
        </section>

        <!-- 4. صفحة الإحصائيات -->
        <section id="stats-page" class="page" style="display: none; padding: 60px 20px; text-align: center;">
            <i class="fa-solid fa-chart-pie" style="font-size: 4rem; color: var(--primary-light); margin-bottom: 20px;"></i>
            <h2>الإحصائيات</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">هنا سيظهر ملخص لعدد الألعاب التي أنهيتها، إجمالي ساعات اللعب، وأكثر التصنيفات التي تلعبها.</p>
        </section>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav glass-panel">
        <button class="nav-item active"><i class="fa-solid fa-calendar-days"></i><span>القادمة</span></button>
        <button class="nav-item"><i class="fa-solid fa-check-double"></i><span>المختومة</span></button>
        <button class="nav-item"><i class="fa-solid fa-clock"></i><span>الانتظار</span></button>
        <button class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>إحصائيات</span></button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
